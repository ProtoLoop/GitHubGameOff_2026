<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GraveyardShift</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: 20px;
        background: #16181d;
        color: #e8e9ed;
        font-family: system-ui, sans-serif;
      }
      h1 { margin: 0 0 16px; font-size: 20px; }
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
        border: 0;
        padding: 0;
        background: #000;
      }
      #canvas { touch-action: none; }
      #status { min-height: 1.5em; color: #b5b9c5; }
    </style>
  </head>
  <body>
    <h1>GraveyardShift</h1>
    <main>
      <canvas id="canvas" width="800" height="600" tabindex="0"
              aria-label="Game view"></canvas>
    </main>
    <p id="status" role="status">Loading…</p>
    <script>
      const gameCanvas = document.getElementById('canvas');
      const statusElement = document.getElementById('status');

      gameCanvas.addEventListener('contextmenu', event => event.preventDefault());

      var Module = {
        canvas: gameCanvas,
        print: (...args) => console.log(...args),
        printErr: (...args) => console.error(...args),
        setStatus: text => { statusElement.textContent = text; },
        onAbort: reason => {
          statusElement.textContent = `Application stopped: ${reason}. See the browser console.`;
        }
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
